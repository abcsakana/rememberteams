<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>アメスポ州マスター ⚾🏈</title>
<style>
:root {
  --bg: #1a1a2e;
  --card: #25274d;
  --card2: #2e3160;
  --accent: #ff6b6b;
  --accent2: #4ecdc4;
  --gold: #ffd93d;
  --text: #f0f0f5;
  --dim: #9a9ab8;
  --mlb: #4ecdc4;
  --nfl: #ff8a5c;
  --ok: #51cf66;
  --ng: #ff6b6b;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  background: var(--bg);
  color: var(--text);
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
}
header {
  padding: calc(var(--safe-top) + 12px) 16px 10px;
  text-align: center;
  background: linear-gradient(135deg, #25274d, #1a1a2e);
  border-bottom: 1px solid #3a3d7a;
}
header h1 { font-size: 19px; letter-spacing: 1px; }
header .sub { font-size: 11px; color: var(--dim); margin-top: 2px; }
main {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 14px calc(var(--safe-bottom) + 80px);
}
nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  background: rgba(30, 32, 64, 0.96);
  backdrop-filter: blur(12px);
  border-top: 1px solid #3a3d7a;
  padding-bottom: var(--safe-bottom);
  z-index: 50;
}
nav button {
  flex: 1;
  background: none;
  border: none;
  color: var(--dim);
  font-size: 10px;
  padding: 8px 0 6px;
  cursor: pointer;
  font-family: inherit;
}
nav button .ico { display: block; font-size: 22px; margin-bottom: 2px; }
nav button.active { color: var(--gold); }

.pill-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.pill {
  border: 1.5px solid #4a4d8a;
  background: var(--card);
  color: var(--dim);
  border-radius: 999px;
  padding: 7px 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.pill.active { background: var(--gold); border-color: var(--gold); color: #1a1a2e; }

/* ===== マップ ===== */
.map-grid {
  display: grid;
  grid-template-columns: repeat(11, 1fr);
  gap: 3px;
  max-width: 560px;
  margin: 0 auto;
}
.tile {
  aspect-ratio: 1;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  background: #2e3160;
  color: #6a6d9a;
  border: none;
  font-family: inherit;
  transition: transform 0.1s;
}
.tile:active { transform: scale(0.9); }
.tile .cnt { font-size: 8px; font-weight: 400; line-height: 1; margin-top: 1px; }
.tile.t1 { background: #3d6b6b; color: #c8f5f0; }
.tile.t2 { background: #2f8f85; color: #fff; }
.tile.t3 { background: #ffb84d; color: #5a3a00; }
.tile.t4 { background: #ff6b6b; color: #fff; }
.tile.empty-slot { background: transparent; cursor: default; }
.map-legend { display: flex; gap: 10px; justify-content: center; margin-top: 12px; font-size: 11px; color: var(--dim); flex-wrap: wrap; }
.map-legend span::before { content: "●"; margin-right: 3px; }
.lg0::before { color: #2e3160; } .lg1::before { color: #3d6b6b; }
.lg2::before { color: #2f8f85; } .lg3::before { color: #ffb84d; } .lg4::before { color: #ff6b6b; }
.canada-chip {
  margin: 14px auto 0; max-width: 560px;
  background: var(--card); border-radius: 12px; padding: 10px 14px;
  font-size: 13px; cursor: pointer; text-align: center; color: var(--dim);
}

/* 州詳細シート */
.sheet-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 100; display: none;
}
.sheet-bg.show { display: block; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 20px 18px calc(var(--safe-bottom) + 24px);
  z-index: 101;
  max-height: 70vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.25s ease;
}
.sheet.show { transform: translateY(0); }
.sheet h2 { font-size: 20px; margin-bottom: 4px; }
.sheet .en { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
.team-card {
  background: var(--card2);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.team-card .emo { font-size: 26px; }
.team-card .nm { font-weight: 700; font-size: 14px; }
.team-card .ct { font-size: 11px; color: var(--dim); margin-top: 2px; }
.team-card .note { font-size: 11px; color: var(--gold); margin-top: 3px; }
.badge {
  font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 5px;
  margin-left: auto; flex-shrink: 0;
}
.badge.MLB { background: var(--mlb); color: #003; }
.badge.NFL { background: var(--nfl); color: #401a00; }
.no-team { text-align: center; color: var(--dim); padding: 24px 0; font-size: 14px; }
.star-mini { font-size: 12px; }

/* ===== 学習リスト ===== */
.state-group { margin-bottom: 10px; }
.state-head {
  width: 100%;
  display: flex; align-items: center; gap: 8px;
  background: var(--card);
  border: none; color: var(--text);
  border-radius: 12px;
  padding: 13px 14px;
  font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  text-align: left;
}
.state-head .cnt-b {
  margin-left: auto;
  background: #3a3d7a; color: var(--text);
  border-radius: 999px; font-size: 11px; padding: 2px 9px; font-weight: 600;
}
.state-body { padding: 8px 4px 2px; display: none; }
.state-group.open .state-body { display: block; }
.search-box {
  width: 100%; padding: 11px 14px;
  border-radius: 12px; border: 1.5px solid #4a4d8a;
  background: var(--card); color: var(--text);
  font-size: 15px; margin-bottom: 12px; font-family: inherit;
}
.search-box::placeholder { color: var(--dim); }

/* ===== クイズ ===== */
.quiz-setup .opt-title { font-size: 13px; color: var(--dim); margin: 14px 0 8px; font-weight: 600; }
.big-start {
  width: 100%;
  background: linear-gradient(135deg, var(--accent), #ff9a5c);
  border: none; border-radius: 16px;
  color: #fff; font-size: 18px; font-weight: 800;
  padding: 17px; margin-top: 22px;
  cursor: pointer; font-family: inherit;
  box-shadow: 0 4px 18px rgba(255,107,107,0.35);
}
.big-start:active { transform: scale(0.97); }
.quiz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--dim); }
.streak { color: var(--gold); font-weight: 700; }
.q-progress { height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
.q-progress > div { height: 100%; background: var(--accent2); border-radius: 3px; transition: width 0.3s; }
.q-card {
  background: var(--card);
  border-radius: 18px;
  padding: 24px 18px;
  text-align: center;
  margin-bottom: 16px;
}
.q-card .q-emo { font-size: 42px; margin-bottom: 8px; }
.q-card .q-team { font-size: 19px; font-weight: 800; line-height: 1.4; }
.q-card .q-ask { font-size: 13px; color: var(--dim); margin-top: 8px; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice {
  background: var(--card2);
  border: 2px solid transparent;
  border-radius: 14px;
  color: var(--text);
  font-size: 15px; font-weight: 600;
  padding: 15px 14px;
  cursor: pointer; font-family: inherit;
  text-align: center;
  transition: transform 0.08s;
}
.choice:active { transform: scale(0.97); }
.choice.correct { background: #1f4d2e; border-color: var(--ok); }
.choice.wrong { background: #4d1f28; border-color: var(--ng); }
.choice:disabled { opacity: 1; }
.feedback {
  text-align: center; margin-top: 16px; font-size: 15px; font-weight: 700;
  min-height: 24px;
}
.feedback .fact { display: block; font-size: 12px; color: var(--gold); font-weight: 500; margin-top: 6px; }
.mini-map {
  display: grid; grid-template-columns: repeat(11, 1fr); gap: 2px;
  max-width: 230px; margin: 10px auto 2px;
}
.mini-tile {
  aspect-ratio: 1; border-radius: 3px; background: #2e3160;
  font-size: 7px; font-weight: 800; font-style: normal;
  display: flex; align-items: center; justify-content: center; color: transparent;
}
.mini-tile.hit { background: var(--gold); color: #1a1a2e; box-shadow: 0 0 8px var(--gold); }
.next-btn {
  width: 100%;
  background: var(--accent2); border: none; border-radius: 14px;
  color: #003; font-size: 16px; font-weight: 800;
  padding: 15px; margin-top: 14px;
  cursor: pointer; font-family: inherit;
}
.result-card {
  background: var(--card); border-radius: 20px;
  padding: 32px 20px; text-align: center;
}
.result-card .r-emo { font-size: 56px; }
.result-card .r-score { font-size: 40px; font-weight: 900; color: var(--gold); margin: 10px 0 4px; }
.result-card .r-msg { font-size: 15px; margin: 10px 0 4px; }
.result-card .r-sub { font-size: 12px; color: var(--dim); }

/* ===== 成績 ===== */
.prog-summary {
  background: var(--card); border-radius: 16px; padding: 18px;
  margin-bottom: 16px;
}
.prog-summary .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
.prog-summary .row:last-child { margin-bottom: 0; }
.bar { flex: 1; height: 10px; background: #3a3d7a; border-radius: 5px; overflow: hidden; }
.bar > div { height: 100%; border-radius: 5px; }
.prog-team {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border-radius: 10px;
  padding: 9px 12px; margin-bottom: 6px; font-size: 13px;
}
.prog-team .stars { margin-left: auto; font-size: 13px; letter-spacing: 1px; }
.reset-btn {
  width: 100%; background: none; border: 1.5px solid var(--ng);
  color: var(--ng); border-radius: 12px; padding: 12px;
  font-size: 14px; font-weight: 700; margin-top: 18px;
  cursor: pointer; font-family: inherit;
}
.section-label { font-size: 13px; font-weight: 700; color: var(--dim); margin: 16px 0 8px; }

/* 紙吹雪 */
.confetti {
  position: fixed; width: 10px; height: 10px;
  top: -12px; z-index: 200; pointer-events: none;
  animation: fall linear forwards;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
}
.hidden { display: none !important; }
</style>
</head>

const STORE_KEY = "usSportsMemo.v1";
let store = loadStore();
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || { correct:{}, bestStreak:0 }; }
  catch { return { correct:{}, bestStreak:0 }; }
}
function saveStore() { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
function correctCount(id) { return store.correct[id] || 0; }
function isMastered(id) { return correctCount(id) >= MASTER_COUNT; }

/* ================= ユーティリティ ================= */
const $ = sel => document.querySelector(sel);
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function teamsIn(region, lg) {
  return TEAMS.filter(t => t.region === region && (lg === "ALL" || t.lg === lg));
}
function leagueFiltered(lg) {
  return lg === "ALL" ? TEAMS : TEAMS.filter(t => t.lg === lg);
}
function starsFor(id) {
  const c = Math.min(correctCount(id), MASTER_COUNT);
  return "⭐".repeat(c) + "☆".repeat(MASTER_COUNT - c);
}
// チーム名から「名称(ニックネーム)」のみを取り出す (例: ボストン・レッドソックス → レッドソックス)
function nickOf(t) { const p = t.name.split("・"); return p[p.length - 1]; }

function renderMap(m) {
  const pills = ["ALL","MLB","NFL"].map(lg =>
    `<button class="pill ${mapFilter===lg?"active":""}" data-lg="${lg}">${lg==="ALL"?"⚾🏈 両方":lg==="MLB"?"⚾ MLB":"🏈 NFL"}</button>`
  ).join("");

  let tiles = "";
  for (const [code, r] of Object.entries(REGIONS)) {
    if (!r.grid) continue;
    const n = teamsIn(code, mapFilter).length;
    const cls = n === 0 ? "" : n === 1 ? "t1" : n === 2 ? "t2" : n <= 4 ? "t3" : "t4";
    tiles += `<button class="tile ${cls}" style="grid-column:${r.grid[0]+1};grid-row:${r.grid[1]+1}" data-region="${code}">
      ${code === "DC" ? "DC" : code}${n ? `<span class="cnt">${n}</span>` : ""}
    </button>`;
  }

  m.innerHTML = `
    <div class="pill-row">${pills}</div>
    <div class="map-grid">${tiles}</div>
    <div class="map-legend">
      <span class="lg0">0チーム</span><span class="lg1">1</span><span class="lg2">2</span><span class="lg3">3〜4</span><span class="lg4">5以上</span>

  m.querySelectorAll("[data-region]").forEach(t => t.addEventListener("click", () => openSheet(t.dataset.region)));
}

  }));

function startQuiz() {
  let questions;
  if (quizSetup.dir === "cs") {
    // 都市 → 州 はチームと無関係。上位50都市からランダムに出題
    questions = shuffle(CITIES).slice(0, QUIZ_LEN).map(makeCS);
  } else {
    const pool = leagueFiltered(quizSetup.lg);
    // 未マスターのチームを優先して出題(重み付け)
    const weighted = [];
    pool.forEach(t => {
      const w = isMastered(t.id) ? 1 : 3;
      for (let i = 0; i < w; i++) weighted.push(t);
    });
    const picked = [];
    const used = new Set();
    const shuffled = shuffle(weighted);
    for (const t of shuffled) {
      if (!used.has(t.id)) { used.add(t.id); picked.push(t); }
      if (picked.length >= QUIZ_LEN) break;
    }
    questions = picked.map(t => {
      let dir = quizSetup.dir;
      if (dir === "mix") dir = ["ns", "nc", "sn"][Math.floor(Math.random() * 3)];
      if (dir === "ns") return makeNS(t);
      if (dir === "nc") return makeNC(t);
      return makeSN(t);
    });
  }
  quiz = { questions, idx: 0, score: 0, streak: 0, bestStreak: 0, answered: false };
  render();
}

// 都市 → 州
function makeCS(c) {
  const others = shuffle(US_STATES.filter(s => s !== c.region)).slice(0, 3);
  const choices = shuffle([c.region, ...others]);
  return { type: "cs", city: c.name, region: c.region, choices, answer: c.region };
}
// 州がアメリカのどの辺にあるかを短い言葉で表す
function areaLabel(code) {
  if (code === "AK") return "アメリカ北西の果て(アラスカ)";
  if (code === "HI") return "太平洋上の島(ハワイ)";
  if (code === "DC") return "東海岸・首都ワシントン";
  const [col, row] = REGIONS[code].grid;
  const v = row <= 2 ? "北" : row <= 4 ? "中" : "南";
  const h = col <= 2 ? "西" : col <= 6 ? "央" : "東";
  const map = {
    "北西":"北西部", "北央":"北部", "北東":"北東部",
    "中西":"西部", "中央":"中部", "中東":"東部",
    "南西":"南西部", "南央":"南部", "南東":"南東部",
  };
  return "アメリカ" + map[v + h];
}
// 解答した州の位置を示すミニ地図(該当州を金色でハイライト)
function miniMap(code) {
  let cells = "";
  for (const [c, r] of Object.entries(REGIONS)) {
    if (!r.grid) continue;
    const hit = c === code;
    cells += `<i class="mini-tile${hit ? " hit" : ""}" style="grid-column:${r.grid[0]+1};grid-row:${r.grid[1]+1}">${hit ? (c === "DC" ? "DC" : c) : ""}</i>`;
  }
  return `<div class="mini-map">${cells}</div>`;
}
// 名称 → 州
function makeNS(team) {
  const others = shuffle([...new Set(
    TEAMS.filter(t => t.lg === team.lg && t.region !== team.region).map(t => t.region)
  )]).slice(0, 3);
  const choices = shuffle([team.region, ...others]);
  return { type: "ns", team, choices, answer: team.region };
}
// 名称 → 都市
function makeNC(team) {
  const others = shuffle([...new Set(
    TEAMS.filter(t => t.lg === team.lg && t.city !== team.city).map(t => t.city)
  )]).slice(0, 3);
  const choices = shuffle([team.city, ...others]);
  return { type: "nc", team, choices, answer: team.city };
}
// 州 → チーム(名称)
function makeSN(team) {
  const decoys = shuffle(
    TEAMS.filter(t => t.lg === team.lg && t.region !== team.region)
  ).slice(0, 3);
  const choices = shuffle([team, ...decoys]);
  return { type: "sn", team, choices, answer: team.id };
}

function renderQuestion(m) {
  const q = quiz.questions[quiz.idx];
  const t = q.team;
  let cardHTML, choicesHTML;
  if (q.type === "cs") {
    cardHTML = `
      <div class="q-emo">🏙️</div>
      <div class="q-team">${esc(q.city)}</div>
      <div class="q-ask">は何州にある?</div>`;
    choicesHTML = q.choices.map(code =>
      `<button class="choice" data-v="${code}">${esc(REGIONS[code].name)}</button>`).join("");
  } else if (q.type === "ns" || q.type === "nc") {
    cardHTML = `
      <div class="q-emo">${t.emoji}</div>
      <div class="q-team"><span class="badge ${t.lg}">${t.lg}</span><br>${esc(nickOf(t))}</div>
      <div class="q-ask">の本拠地の${q.type === "ns" ? "州" : "都市"}は?</div>`;
    if (q.type === "ns")
      choicesHTML = q.choices.map(code =>
        `<button class="choice" data-v="${code}">${esc(REGIONS[code].name)}</button>`).join("");
    else
      choicesHTML = q.choices.map(c =>
        `<button class="choice" data-v="${esc(c)}">${esc(c)}</button>`).join("");
  } else {
    cardHTML = `
      <div class="q-emo">📍</div>
      <div class="q-team">${esc(REGIONS[t.region].name)}</div>
      <div class="q-ask">に本拠地がある${t.lg}チームはどれ?</div>`;
    choicesHTML = q.choices.map(c =>
      `<button class="choice" data-v="${c.id}">${c.emoji} ${esc(nickOf(c))}</button>`).join("");
  }

  m.innerHTML = `
    <div class="quiz-top">
      <span>第 ${quiz.idx + 1} / ${QUIZ_LEN} 問</span>
      <span class="streak">${quiz.streak >= 2 ? "🔥" + quiz.streak + "連続!" : ""}</span>
      <span>スコア ${quiz.score}</span>
    </div>
    <div class="q-progress"><div style="width:${(quiz.idx / QUIZ_LEN) * 100}%"></div></div>
    <div class="q-card">${cardHTML}</div>
    <div class="choices">${choicesHTML}</div>
    <div class="feedback" id="fb"></div>
    <div id="nextWrap"></div>
  `;
  m.querySelectorAll(".choice").forEach(b =>
    b.addEventListener("click", () => answer(b, q)));
}

function answer(btn, q) {
  if (quiz.answered) return;
  quiz.answered = true;
  const v = btn.dataset.v;
  const ok = v === q.answer;
  const t = q.team;

  document.querySelectorAll(".choice").forEach(b => {
    b.disabled = true;
    if (b.dataset.v === q.answer) b.classList.add("correct");
    else if (b === btn && !ok) b.classList.add("wrong");
  });

  // 解答に対応する州コード(位置表示用)。都市問題は q.region、それ以外はチームの州
  const stateCode = t ? t.region : q.region;
  // 「都市/名称 → 都市 / 州」のおさらい行
  const reveal = q.type === "cs"
    ? `<span class="fact">🏙️ ${esc(q.city)} → ${esc(REGIONS[q.region].name)}</span>`
    : `<span class="fact">${t.emoji} ${esc(nickOf(t))} → ${esc(t.city)} / ${esc(REGIONS[t.region].name)}</span>`;
  // 州がアメリカのどの辺にあるか(方角ラベル + ミニ地図)
  const geo = `<span class="fact">🧭 ${esc(areaLabel(stateCode))}</span>` + miniMap(stateCode);

  const fb = $("#fb");
  if (ok) {
    quiz.score++;
    quiz.streak++;
    quiz.bestStreak = Math.max(quiz.bestStreak, quiz.streak);
    if (t) store.correct[t.id] = correctCount(t.id) + 1;
    if (quiz.streak > (store.bestStreak || 0)) store.bestStreak = quiz.streak;
    saveStore();
    const cheers = ["ナイス!", "正解!", "さすが!", "完璧!", "その調子!"];
    fb.innerHTML = `<span style="color:var(--ok)">⭕ ${cheers[Math.floor(Math.random()*cheers.length)]}</span>` +
      reveal +
      (t && isMastered(t.id) && correctCount(t.id) === MASTER_COUNT ? `<span class="fact">🏆 ${esc(t.name)} をマスターした!</span>` : "") +
      (t && t.note ? `<span class="fact">💡 ${esc(t.note)}</span>` : "") +
      geo;
    burstConfetti(quiz.streak >= 3 ? 30 : 12);
  } else {
    quiz.streak = 0;
    const correctLabel = (q.type === "ns" || q.type === "cs") ? REGIONS[q.answer].name : q.type === "nc" ? q.answer : nickOf(t);
    fb.innerHTML = `<span style="color:var(--ng)">❌ 残念… 正解は「${esc(correctLabel)}」</span>` +
      reveal +
      (t && t.note ? `<span class="fact">💡 ${esc(t.note)}</span>` : "") +
      geo;
  }
  $("#nextWrap").innerHTML = `<button class="next-btn">${quiz.idx + 1 >= QUIZ_LEN ? "結果を見る 🏁" : "次の問題へ ▶"}</button>`;
  $("#nextWrap .next-btn").addEventListener("click", () => {
    quiz.idx++;
    quiz.answered = false;
    render();
  });
}

function renderQuizResult(m) {
  const s = quiz.score;
  const [emo, msg] =
    s === QUIZ_LEN ? ["👑", "パーフェクト!!アメスポ博士の称号を授けよう!"] :
    s >= 8 ? ["🎉", "素晴らしい!ほぼマスターだ!"] :
    s >= 6 ? ["💪", "いい感じ!あと少しで上級者!"] :
    s >= 4 ? ["🌱", "成長中!学習モードで復習してまた挑戦しよう"] :
             ["🔰", "まだまだこれから!マップで眺めるところから始めよう"];
  if (s >= 8) burstConfetti(60);
  m.innerHTML = `
    <div class="result-card">
      <div class="r-emo">${emo}</div>
      <div class="r-score">${s} / ${QUIZ_LEN}</div>
      <div class="r-msg">${msg}</div>
      <div class="r-sub">最高連続正解: ${quiz.bestStreak} 🔥 (自己ベスト ${store.bestStreak || 0})</div>
      <button class="big-start" id="again">もう一回! 🔁</button>
      <button class="next-btn" id="backSetup" style="margin-top:10px">設定に戻る</button>
    </div>`;
  $("#again").addEventListener("click", startQuiz);
  $("#backSetup").addEventListener("click", () => { quiz = null; render(); });
}

/* ================= 成績 ================= */
function renderProgress(m) {
  const sections = ["MLB","NFL"].map(lg => {
    const list = TEAMS.filter(t => t.lg === lg);
    const mastered = list.filter(t => isMastered(t.id)).length;
    const pct = Math.round((mastered / list.length) * 100);
    const color = lg === "MLB" ? "var(--mlb)" : "var(--nfl)";
    const rows = list
      .slice()
      .sort((a, b) => correctCount(b.id) - correctCount(a.id))
      .map(t => `<div class="prog-team">
        <span>${t.emoji}</span><span>${esc(t.name)}</span>
        <span class="stars">${isMastered(t.id) ? "🏆" : starsFor(t.id)}</span>
      </div>`).join("");
    return `
      <div class="prog-summary">
        <div class="row">
          <strong>${lg === "MLB" ? "⚾ MLB" : "🏈 NFL"}</strong>
          <div class="bar"><div style="width:${pct}%;background:${color}"></div></div>
          <span>${mastered}/${list.length}</span>
        </div>
      </div>
      <div class="section-label">${lg} チーム別 (⭐${MASTER_COUNT}つで🏆マスター)</div>
      ${rows}`;
  }).join("");

  m.innerHTML = `${sections}
    <button class="reset-btn" id="resetBtn">記録をリセット</button>`;
  $("#resetBtn").addEventListener("click", () => {
    if (confirm("本当に学習記録をリセットする?")) {
      store = { correct: {}, bestStreak: 0 };
      saveStore();
      render();
    }
  });
}

/* ================= 紙吹雪 ================= */
function burstConfetti(n) {
  const colors = ["#ff6b6b","#4ecdc4","#ffd93d","#a29bfe","#51cf66","#ff9a5c"];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = 1.2 + Math.random() * 1.2 + "s";
    c.style.animationDelay = Math.random() * 0.3 + "s";
    c.style.borderRadius = Math.random() < 0.5 ? "50%" : "2px";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

render();
</script>
